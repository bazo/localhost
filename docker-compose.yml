    pocketid:
        image: ghcr.io/pocket-id/pocket-id:latest
        container_name: pocketid
        volumes:
            - ./.docker/volumes/pocketid:/app/data
        # secrets:
        #     - pocketid_encryption_key
        #     - maxmind_license_key
        environment:
            #ENCRYPTION_KEY_FILE: /run/secrets/pocketid_encryption_key
            ANALYTICS_DISABLED: "true"
            #MAXMIND_LICENSE_KEY_FILE: /run/secrets/maxmind_license_key
            APP_URL: http://auth.localhost
        networks:
            - default
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:1411/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        labels:
            - traefik.enable=true
            - traefik.http.routers.pocketid.rule=Host(`auth.localhost`)
            - traefik.http.routers.pocketid.entrypoints=web
            - traefik.http.services.pocketid.loadbalancer.server.port=1411

    code-server:
        image: codercom/code-server:latest # Alebo linuxserver/code-server podľa preferencie
        container_name: code-server
        environment:
            #- PASSWORD=mojetajneheslo # Nastav svoje heslo (alebo použij env pre token/autentizáciu)
            - TZ=Europe/Bratislava
        volumes:
            - ./.docker/volumes/coder/.config:/home/coder/.config
            - /Users/bazo/apps:/home/coder
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.coder.rule=Host(`coder.localhost`)
            - traefik.http.routers.coder.entrypoints=web
            - traefik.http.services.coder.loadbalancer.server.port=8080

    authd:
        image: ghcr.io/bazo/authd:latest
        container_name: authd
        restart: unless-stopped
        user: root
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            # Required configuration - using HTTP for localhost development
            AUTHD_ISSUER: http://authd.localhost
            AUTHD_PUBLIC_URL: http://authd.localhost
            AUTHD_WEBAUTHN_RPID: authd.localhost

            # Database configuration
            AUTHD_DB_HOST: mysql
            AUTHD_DB_PORT: "3306"
            AUTHD_DB_USER: root
            AUTHD_DB_DATABASE: authd
            AUTHD_DB_PASSWORD: root

            # HTTP configuration
            AUTHD_LISTEN: ":8080"

            # Cookie configuration - adjusted for HTTP
            AUTHD_COOKIE_NAME: authd
            AUTHD_COOKIE_SECURE: "false"
            AUTHD_COOKIE_SAMESITE: Lax
            AUTHD_COOKIE_DOMAIN: ""
            AUTHD_COOKIE_MAX_AGE: "86400"

            # Redis configuration
            AUTHD_REDIS_URL: redis://redis:6379/0

            # WebAuthn configuration
            AUTHD_WEBAUTHN_RPNAME: AuthD

            # JWT configuration
            AUTHD_JWT_ALG: ES256
            AUTHD_JWT_ROTATE_DAYS: "30"
            AUTHD_JWT_TTL_ACCESS: 10m
            AUTHD_JWT_TTL_REFRESH: 720h

            # Forward auth configuration
            AUTHD_FORWARDAUTH_DEFAULT_MODE: "302"

            # Docker integration (for auto-discovery)
            AUTHD_DOCKER_SOCKET: /var/run/docker.sock
            AUTHD_DOCKER_WATCH: "true"

        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        # healthcheck:
        #     test: ["CMD-SHELL", "timeout 5 sh -c '</dev/tcp/localhost/8080' || exit 1"]
        #     interval: 15s
        #     timeout: 5s
        #     retries: 3
        #     start_period: 40s
        labels:
            - traefik.enable=true
            - traefik.http.routers.authd.rule=Host(`authd.localhost`)
            - traefik.http.routers.authd.entrypoints=web
            - traefik.http.services.authd.loadbalancer.server.port=8080
        networks:
            - default

    php:
        image: ghcr.io/forclimb/prestashop/prestashop-php:presta9
        container_name: presta9-php
        restart: unless-stopped
        ulimits:
            nofile:
                soft: 8192
                hard: 8192
        environment:
            # PrestaShop Core Config
            - PS_DOMAIN=forclimb.localhost
            - PS_FOLDER_ADMIN=${PS_FOLDER_ADMIN:-adminps}
            - PS_FOLDER_INSTALL=${PS_FOLDER_INSTALL:-install}
            - PS_COUNTRY=${PS_COUNTRY:-SK}
            - PS_LANGUAGE=${PS_LANGUAGE:-sk}
            - PS_INSTALL_AUTO=${PS_INSTALL_AUTO:-0}
            - PS_DEV_MODE=${PS_DEV_MODE:-0}
            - PS_ENABLE_SSL=${PS_ENABLE_SSL:-0}

            # Database Configuration
            - DB_SERVER=mysql
            - DB_NAME=${MYSQL_DATABASE:-presta9}
            - DB_USER=${MYSQL_USER:-root}
            - DB_PASSWD=${MYSQL_PASSWORD:-root}
            - DB_PREFIX=${DB_PREFIX:-ps_}

            # Redis Cache Configuration
            # - PS_CACHE_ENABLE=1
            # - PS_CACHING=CacheRedis
            # - REDIS_HOST=redis
            # - REDIS_PORT=6379
            # - REDIS_DATABASE=0
            # - PS_CACHE_REDIS_PERSISTENT=0
            # - PS_CACHE_REDIS_TIMEOUT=2.0
            # - PS_CACHE_REDIS_READ_TIMEOUT=2.0

            # PHP Configuration
            - PHP_MEMORY_LIMIT=512M
            - PHP_MAX_EXECUTION_TIME=120
            - PHP_UPLOAD_MAX_FILESIZE=64M
            - PHP_POST_MAX_SIZE=64M

            # Environment
            - ENVIRONMENT=production

            # PrestaShop 9 Application Environment Variables (required by index.php)
            - DEV=1
            - DISPLAY_ERRORS=1
            - DISPLAY_STARTUP_ERRORS=1
            - OPCACHE_DISABLE=0

            # PrestaShop 9 Symfony-style database configuration
            - DATABASE_HOST=mysql
            - DATABASE_PORT=3306
            - DATABASE_NAME=${MYSQL_DATABASE:-presta9}
            - DATABASE_USER=${MYSQL_USER:-root}
            - DATABASE_PASSWORD=${MYSQL_PASSWORD:-root}
            - DATABASE_PREFIX=${DB_PREFIX:-ps_}
            - DATABASE_ENGINE=InnoDB
        volumes:
            # Persistent data volumes only (code is in image)
            #- prestashop-var:/www/var
            - ./.docker/volumes/presta/var:/www/var
            #- prestashop-config:/www/app/config
            #- prestashop-img:/www/img
            - prestashop-download:/www/download
            - prestashop-upload:/www/upload
        expose:
            - 9000
        healthcheck:
            test: ["CMD", "php-fpm8.4", "-t"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    # Nginx Web Server
    nginx:
        image: ghcr.io/forclimb/prestashop/prestashop-php:presta9
        container_name: presta9-nginx
        restart: unless-stopped
        command: ["nginx"]
        depends_on:
            php:
                condition: service_healthy
        environment:
            - ENVIRONMENT=production
        volumes:
            # Share uploaded files with nginx for serving
            - prestashop-img:/www/img:ro
            - prestashop-download:/www/download:ro
            - prestashop-upload:/www/upload:ro
        labels:
            # Traefik configuration
            - traefik.enable=true
            - traefik.docker.network=gateway

            # HTTP Router
            - traefik.http.routers.presta9.rule=Host(`forclimb.localhost`) || Host(`forclimb.test`)
            - traefik.http.routers.presta9.entrypoints=web
            - traefik.http.routers.presta9.service=presta9

            # Service configuration
            - traefik.http.services.presta9.loadbalancer.server.port=80
            - traefik.http.services.presta9.loadbalancer.healthcheck.path=/
            - traefik.http.services.presta9.loadbalancer.healthcheck.interval=30s
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "--spider",
                    "http://localhost:80/",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

networks:
    default:
        name: gateway
        external: true

volumes:
    prestashop-var:
        driver: local
    prestashop-config:
        driver: local
    prestashop-img:
        driver: local
    prestashop-download:
        driver: local
    prestashop-upload:
        driver: local
