services:
    mysql:
        container_name: mysql
        restart: always
        image: mysql:9
        command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL #--skip-grant-tables --skip-networking=0
        environment:
            MYSQL_ROOT_PASSWORD: root
        ports:
            - 3306:3306
        volumes:
            - ./.docker/volumes/mysql:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-proot",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - default

    postgres:
        profiles: ["extended"]
        image: postgres
        container_name: postgres
        restart: always
        environment:
            #POSTGRES_DB: mydb
            #POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        ports:
            - 5432:5432
        volumes:
            - ./.docker/volumes/postgres:/var/lib/postgresql
        networks:
            - default

    traefik:
        container_name: traefik
        restart: always
        image: traefik
        command:
            #- "--log.level=DEBUG"
            - "--log.level=INFO"
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            #- "--entrypoints.websecure.address=:443"
            #- "--entrypoints.websecure.http.tls=false"
            #- "--entrypoints.web.http.redirections.entrypoint.to=web"
            #- "--entrypoints.web.http.redirections.entrypoint.scheme=http"
        ports:
            - "80:80"
            #- "8080:8080"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
        labels:
            - traefik.enable=true
            - traefik.http.routers.traefik-api.rule=Host(`traefik.localhost`)
            - traefik.http.routers.traefik-api.service=api@internal
        networks:
            - default

    maildebug:
        profiles: ["extended"]
        container_name: maildebug
        image: bazo/maildebug
        restart: always
        depends_on: [traefik]
        ports:
            - 1025:1025
        volumes:
            - ./.docker/volumes/maildebug:/data
        labels:
            - traefik.enable=true
            - traefik.port=8100
            - traefik.http.routers.maildebug.rule=Host(`maildebug.localhost`)
            - traefik.http.routers.maildebug.entrypoints=web
            - traefik.http.services.maildebug.loadbalancer.server.port=8100
        networks:
            - default

    var-dumper-server:
        profiles: ["extended"]
        container_name: var-dumper-server
        image: bazo/var-dumper-server
        restart: always
        depends_on: [traefik]
        ports:
            - 9912:9912
            #- 9900:9900
        volumes:
            - ./.docker/volumes/var-dumps:/server/db
        labels:
            - traefik.enable=true
            - traefik.port=9900
            - traefik.http.routers.var-dumper-server.rule=Host(`vardumps.localhost`)
            - traefik.http.routers.var-dumper-server.entrypoints=web
            - traefik.http.services.var-dumper-server.loadbalancer.server.port=9900

    # mongo:
    #     container_name: mongo
    #     image: mongo
    #     restart: always
    #     ports:
    #         - 27017:27017
    #     volumes:
    #         - ./.docker/volumes/mongo:/data/db

    redis:
        container_name: redis
        image: redis:alpine
        restart: always
        command: >
            redis-server
            --maxmemory ${REDIS_MAXMEMORY:-256mb}
            --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
            --save ""
            --appendonly no
        ports:
            - 6379:6379
        volumes:
            - ./.docker/volumes/redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 5s

    rabbitmq:
        #profiles: ["extended"]
        container_name: rabbitmq
        image: rabbitmq:management-alpine
        restart: always
        # entrypoint:
        #     [
        #         "/bin/sh",
        #         "-c",
        #         "chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie && chmod 400 /var/lib/rabbitmq/.erlang.cookie && exec docker-entrypoint.sh rabbitmq-server",
        #     ]
        environment:
            RABBITMQ_NODENAME: rabbit@localhost
            NODENAME: rabbit@localhost
        ports:
            - 5672:5672
            - 15672:15672
        volumes:
            - ./.docker/volumes/rabbitmq:/var/lib/rabbitmq
        labels:
            - traefik.enable=true
            - traefik.port=15672
            - traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)
            - traefik.http.routers.rabbitmq.entrypoints=web
            - traefik.http.services.rabbitmq.loadbalancer.server.port=15672

    #https://www.reddit.com/r/selfhosted/comments/1kva3pw/avoid_minio_developers_introduce_trojan_horse/
    minio:
        #profiles: ["extended"]
        container_name: minio
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        restart: always
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: root
            MINIO_ROOT_PASSWORD: rootroot
            MINIO_BROWSER_REDIRECT_URL: http://minio-console.localhost
            MINIO_DOMAIN: minio.localhost
        volumes:
            - ./.docker/volumes/minio:/data # 👈 Persist data in host folder
        labels:
            - traefik.enable=true

            # API on http://minio.localhost
            - traefik.http.routers.minio.rule=Host(`minio.localhost`) || Host(`uploads.minio.localhost`)
            - traefik.http.routers.minio.entrypoints=web
            - traefik.http.services.minio.loadbalancer.server.port=9000
            - traefik.http.routers.minio.service=minio

            # # Console on http://minio-console.localhost
            - traefik.http.routers.minio-console.rule=Host(`minio-console.localhost`)
            - traefik.http.routers.minio-console.entrypoints=web
            - traefik.http.services.minio-console.loadbalancer.server.port=9001
            - traefik.http.routers.minio-console.service=minio-console

        networks:
            - default

    deployer:
        image: ghcr.io/brainz-digital/swarm-deployer:latest
        container_name: deployer
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        user: root
        environment:
            GHCR_TOKEN: ${GHCR_TOKEN}
            DB_HOST: mysql
            DB_PORT: 3306
            DB_USER: root
            DB_PASSWORD: root
            DB_NAME: deployments
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "-O",
                    "/dev/null",
                    "http://localhost:8080/health",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.deployer.rule=Host(`deploy.localhost`)
            - traefik.http.routers.deployer.entrypoints=web
            - traefik.http.services.deployer.loadbalancer.server.port=8080
        networks:
            - default

    # oracle-db:
    #     image: container-registry.oracle.com/database/free:latest
    #     container_name: oracle-db
    #     ports:
    #         - "1521:1521" # Oracle listener
    #         - "5500:5500" # Oracle EM Express (optional)
    #     environment:
    #         ORACLE_PWD: root
    #         ORACLE_CHARACTERSET: AL32UTF8
    #         ORACLE_AUTO_START: true
    #     volumes:
    #         - ./.docker/volumes/oracle:/opt/oracle/oradata
    #     networks:
    #         - default

    portainer:
        image: portainer/portainer-ce:latest
        container_name: portainer
        volumes:
            - ./.docker/volumes/portainer:/data
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.portainer.rule=Host(`portainer.localhost`)
            - traefik.http.routers.portainer.entrypoints=web
            - traefik.http.services.portainer.loadbalancer.server.port=9000
            - traefik.http.routers.portainer.service=portainer
        networks:
            - default

    zookeeper:
        #profiles: ["kafka"]
        image: zookeeper
        container_name: zookeeper
        restart: unless-stopped
        # ports:
        #     - 2181:2181
        labels:
            - traefik.enable=false
        networks:
            - default

    kafka:
        #profiles: ["kafka"]
        #image: quay.io/debezium/kafka:3.3.0.Final
        build:
            context: ./.docker/containers/kafka
            args:
                UID: ${UID}
        container_name: kafka
        restart: unless-stopped
        depends_on:
            - zookeeper
        expose:
            - 9092
        environment:
            ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

            KAFKA_CONTROLLER_SOCKET_TIMEOUT_MS: 60000
            KAFKA_QUEUED_MAX_REQUESTS: 500
            KAFKA_NUM_NETWORK_THREADS: 8
            KAFKA_NUM_IO_THREADS: 8
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            KAFKA_HEARTBEAT_INTERVAL_MS: 3000
            KAFKA_SESSION_TIMEOUT_MS: 45000
        volumes:
            - ./.docker/containers/kafka/create-topics.sh:/kafka/create-topics.sh
            - ./.docker/volumes/kafka/data:/kafka/data
            - ./.docker/volumes/kafka/logs:/kafka/logs
        networks:
            - default

    connect:
        #profiles: ["kafka"]
        #image: quay.io/debezium/connect:3.3.0.Final
        build:
            context: ./.docker/containers/connect
            args:
                UID: ${UID}
        container_name: connect
        restart: unless-stopped
        depends_on:
            - kafka
            - mysql
        ports:
            - 8083:8083
        environment:
            - BOOTSTRAP_SERVERS=kafka:9092
            - GROUP_ID=1
            - CONFIG_STORAGE_TOPIC=my_connect_configs
            - OFFSET_STORAGE_TOPIC=my_connect_offsets
            - STATUS_STORAGE_TOPIC=my_connect_statuses
            - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
            - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
            - VALUE_CONVERTER_SCHEMAS_ENABLE=false
            - KEY_CONVERTER_SCHEMAS_ENABLE=false
            - PLUGIN_PATH=/kafka/connect

            - CONNECT_CONSUMER_HEARTBEAT_INTERVAL_MS=3000
            - CONNECT_CONSUMER_SESSION_TIMEOUT_MS=45000
            - LOG4J_CONFIGURATION_FILE=/kafka/config/connect-log4j2.yaml
        volumes:
            - /Users/bazo/apps/forclimb/eshop/.db-changes:/data
            - /Users/bazo/apps/himala.sk/.db-changes:/data-himala
            - ./.docker/volumes/kafka-connect/storage:/kafka/connect/storage/
            - ./.docker/volumes/kafka/data:/kafka/data
            - ./.docker/volumes/kafka/logs:/kafka/logs
            - ./.docker/containers/connect/connect-log4j2.yaml:/kafka/config/connect-log4j2.yaml
        networks:
            - default

    kafka-ui:
        #profiles: ["kafka"]
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        restart: unless-stopped
        depends_on:
            - kafka
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
            KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
        labels:
            - traefik.enable=true
            - traefik.http.routers.kafka-ui.rule=Host(`kafka-ui.localhost`)
            - traefik.http.routers.kafka-ui.entrypoints=web
            - traefik.http.routers.kafka-ui.service=kafka-ui
            - traefik.http.services.kafka-ui.loadbalancer.server.port=8080
        networks:
            - default

    # debezium-server:
    #     image: quay.io/debezium/server:3.3.0.Final
    #     container_name: debezium-server
