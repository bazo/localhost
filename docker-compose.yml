services:
    mysql:
        container_name: mysql
        restart: always
        image: mysql:8.3
        command: --default-authentication-plugin=mysql_native_password --server-id=1 --log-bin=mysql-bin --binlog-format=ROW --binlog-row-image=FULL
        environment:
            MYSQL_ROOT_PASSWORD: root
        ports:
            - 3306:3306
        volumes:
            - ./.docker/volumes/mysql:/var/lib/mysql
        networks:
            - default

    postgres:
        profiles: ["extended"]
        image: postgres
        container_name: postgres
        restart: always
        environment:
            #POSTGRES_DB: mydb
            #POSTGRES_USER: root
            POSTGRES_PASSWORD: root
        ports:
            - 5432:5432
        volumes:
            - ./.docker/volumes/postgres:/var/lib/postgresql
        networks:
            - default

    traefik:
        container_name: traefik
        restart: always
        image: traefik
        command:
            #- "--log.level=DEBUG"
            - "--log.level=INFO"
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            #- "--entrypoints.websecure.address=:443"
            #- "--entrypoints.websecure.http.tls=false"
            #- "--entrypoints.web.http.redirections.entrypoint.to=web"
            #- "--entrypoints.web.http.redirections.entrypoint.scheme=http"
        ports:
            - "80:80"
            #- "8080:8080"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
        labels:
            - traefik.enable=true
            - traefik.http.routers.traefik-api.rule=Host(`traefik.localhost`)
            - traefik.http.routers.traefik-api.service=api@internal
        networks:
            - default

    maildebug:
        profiles: ["extended"]
        container_name: maildebug
        image: bazo/maildebug
        restart: always
        depends_on: [traefik]
        ports:
            - 1025:1025
        volumes:
            - ./.docker/volumes/maildebug:/data
        labels:
            - traefik.enable=true
            - traefik.port=8100
            - traefik.http.routers.maildebug.rule=Host(`maildebug.localhost`)
            - traefik.http.routers.maildebug.entrypoints=web
            - traefik.http.services.maildebug.loadbalancer.server.port=8100
        networks:
            - default

    var-dumper-server:
        profiles: ["extended"]
        container_name: var-dumper-server
        image: bazo/var-dumper-server
        restart: always
        depends_on: [traefik]
        ports:
            - 9912:9912
            #- 9900:9900
        volumes:
            - ./.docker/volumes/var-dumps:/server/db
        labels:
            - traefik.enable=true
            - traefik.port=9900
            - traefik.http.routers.var-dumper-server.rule=Host(`vardumps.localhost`)
            - traefik.http.routers.var-dumper-server.entrypoints=web
            - traefik.http.services.var-dumper-server.loadbalancer.server.port=9900

    # mongo:
    #     container_name: mongo
    #     image: mongo
    #     restart: always
    #     ports:
    #         - 27017:27017
    #     volumes:
    #         - ./.docker/volumes/mongo:/data/db

    redis:
        container_name: redis
        image: redis:alpine
        restart: always
        ports:
            - 6379:6379
        volumes:
            - ./.docker/volumes/redis:/data

    rabbitmq:
        profiles: ["extended"]
        container_name: rabbitmq
        image: rabbitmq:4-management-alpine
        restart: always
        entrypoint:
            [
                "/bin/sh",
                "-c",
                "chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie && chmod 400 /var/lib/rabbitmq/.erlang.cookie && exec docker-entrypoint.sh rabbitmq-server",
            ]
        environment:
            RABBITMQ_NODENAME: rabbit@localhost
            NODENAME: rabbit@localhost
        ports:
            - 5672:5672
            - 15672:15672
        volumes:
            - ./.docker/volumes/rabbitmq:/var/lib/rabbitmq

    minio:
        profiles: ["extended"]
        container_name: minio
        image: minio/minio
        restart: always
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: root
            MINIO_ROOT_PASSWORD: rootroot
            MINIO_BROWSER_REDIRECT_URL: http://minio-console.localhost
            MINIO_DOMAIN: minio.localhost
        volumes:
            - ./.docker/volumes/minio:/data # 👈 Persist data in host folder
        labels:
            - traefik.enable=true

            # API on http://minio.localhost
            - traefik.http.routers.minio.rule=Host(`minio.localhost`) || Host(`uploads.minio.localhost`)
            - traefik.http.routers.minio.entrypoints=web
            - traefik.http.services.minio.loadbalancer.server.port=9000
            - traefik.http.routers.minio.service=minio

            # # Console on http://minio-console.localhost
            - traefik.http.routers.minio-console.rule=Host(`minio-console.localhost`)
            - traefik.http.routers.minio-console.entrypoints=web
            - traefik.http.services.minio-console.loadbalancer.server.port=9001
            - traefik.http.routers.minio-console.service=minio-console

        networks:
            - default

    # oracle-db:
    #     image: container-registry.oracle.com/database/free:latest
    #     container_name: oracle-db
    #     ports:
    #         - "1521:1521" # Oracle listener
    #         - "5500:5500" # Oracle EM Express (optional)
    #     environment:
    #         ORACLE_PWD: root
    #         ORACLE_CHARACTERSET: AL32UTF8
    #         ORACLE_AUTO_START: true
    #     volumes:
    #         - ./.docker/volumes/oracle:/opt/oracle/oradata
    #     networks:
    #         - default

    portainer:
        image: portainer/portainer-ce:latest
        container_name: portainer
        volumes:
            - ./.docker/volumes/portainer:/data
            # nepovinne: lokálny docker socket ak chceš spravovať aj lokálny docker
            - /var/run/docker.sock:/var/run/docker.sock
        restart: unless-stopped
        labels:
            - traefik.enable=true
            - traefik.http.routers.portainer.rule=Host(`portainer.localhost`)
            - traefik.http.routers.portainer.entrypoints=web
            - traefik.http.services.portainer.loadbalancer.server.port=9000
            - traefik.http.routers.portainer.service=portainer
        networks:
            - default

networks:
    default:
        name: gateway
        external: true
